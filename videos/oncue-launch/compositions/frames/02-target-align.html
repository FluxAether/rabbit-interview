          0.3
        );

        // Scene 2: (2.7s - 4.8s) "导入简历与目标岗位，"
        tl.fromTo(scope + " .f2-resume-card",
          { opacity: 0, x: -60 },
          { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" },
          2.6
        );
        tl.fromTo(scope + " .f2-jd-card",
          { opacity: 0, x: 60 },
          { opacity: 1, x: 0, duration: 0.7, ease: "expo.out" },
          2.8
        );
        tl.fromTo(scope + " .f2-beam-indicator",
          { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1, duration: 0.4 },
          3.2
        );

        // Scene 3: (5.0s - 7.2s) "AI 深度解析匹配度，"
        tl.fromTo(scope + " .f2-score-card",
          { opacity: 0, y: 40, scale: 0.95 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "expo.out" },
          4.9
        );

        // Score dial progress animation: from 60% (dashoffset 170.9) to 82% (dashoffset 76.9)
        var circumference = 427.25;
        var startOffset = circumference * (1 - 0.60); // 170.9
        var targetOffset = circumference * (1 - 0.82); // 76.9

        tl.fromTo(scope + " .f2-circle-prog",
          { strokeDashoffset: startOffset },
          { strokeDashoffset: targetOffset, duration: 1.8, ease: "power2.out" },
          5.3
        );

        // Count up number: 60% -> 82%
        var scoreCounter = { val: 60 };
        var scoreEl = document.getElementById("f2-score-num");
        tl.to(scoreCounter, {
          val: 82,
          duration: 1.8,
          ease: "power2.out",
          onUpdate: function() {
            if (scoreEl) scoreEl.textContent = Math.round(scoreCounter.val) + "%";
          }
        }, 5.3);

        // Scene 4: (7.4s - 10.5s) "自动提炼量化亮点与核心关键词，"
        tl.fromTo(scope + " .f2-hl-1",
          { opacity: 0, x: 40 },
          { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" },
          7.4
        );
        tl.fromTo(scope + " .f2-hl-2",
          { opacity: 0, x: 40 },
          { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" },
          8.6
