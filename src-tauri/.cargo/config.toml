# Optional hints for macOS builds involving ScreenCaptureKit / Swift bridges.
# These are only useful when you have the full Xcode installed.

[target.aarch64-apple-darwin]
# Try to help locate Swift libraries if using Command Line Tools + full Xcode
rustflags = [
    "-L", "/Library/Developer/CommandLineTools/usr/lib/swift/macosx",
    "-L", "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx"
]

[target.x86_64-apple-darwin]
rustflags = [
    "-L", "/Library/Developer/CommandLineTools/usr/lib/swift/macosx",
    "-L", "/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx"
]
