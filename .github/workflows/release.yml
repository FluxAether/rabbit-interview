name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PUBLIC_REPO: thomas92118/rabbit-interview-downloads

jobs:
  prepare-public-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create public draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DISTRIBUTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PUBLIC_DISTRIBUTION_TOKEN is not set; skipping public draft release."
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "Public release $GITHUB_REF_NAME already exists; assets will be replaced."
          else
            gh release create "$GITHUB_REF_NAME" \
              -R "$PUBLIC_REPO" \
              --target main \
              --draft \
              --title "Rabbit Interview $GITHUB_REF_NAME 测试版" \
              --notes "构建进行中。安装包与校验文件将在双平台构建完成后发布。"
          fi

  build:
    needs: prepare-public-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: app,dmg
            platform_os: darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle: msi,nsis
            platform_os: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AudioTee universal sidecar
        if: matrix.platform_os == 'darwin'
        run: scripts/build-audiotee.sh universal

      - name: Build macOS application
        if: matrix.platform_os == 'darwin'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.audiotee.conf.json

      - name: Verify bundled AudioTee
        if: matrix.platform_os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Rabbit Interview.app"
          test -x "$APP/Contents/MacOS/audiotee"
          test "$(lipo -archs "$APP/Contents/MacOS/audiotee")" = "x86_64 arm64"
          codesign -f -s - --deep "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Build Windows application
        if: matrix.platform_os == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Build updater fragment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-updater-manifest.mjs fragment \
            --os "${{ matrix.platform_os }}" \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$PUBLIC_REPO" \
            --notes "$GITHUB_REF_NAME 测试版" \
            --out "updater-fragment-${{ matrix.platform_os }}.json"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-assets
          copy_normalized() {
            local source="$1"
            local name="${source##*/}"
            cp "$source" "release-assets/${name// /.}"
          }
          while IFS= read -r asset; do
            copy_normalized "$asset"
          done < <(find "$BUNDLE" -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.app.tar.gz.sig' -o \
            -name '*.msi' -o \
            -name '*.msi.sig' -o \
            -name '*.exe' -o \
            -name '*.exe.sig' \
          \))
          if [ "${{ matrix.platform_os }}" = "darwin" ]; then
            INSTALLER="$(find "$BUNDLE" -type f -name '*.dmg' -print -quit)"
            test -n "$INSTALLER"
            cp "$INSTALLER" release-assets/RabbitInterview-macOS-universal.dmg
            test -f src-tauri/target/audiotee-checksums.txt
            cp src-tauri/target/audiotee-checksums.txt release-assets/
          else
            INSTALLER="$(find "$BUNDLE" -type f -path '*/nsis/*-setup.exe' -print -quit)"
            test -n "$INSTALLER"
            cp "$INSTALLER" release-assets/RabbitInterview-Windows-x64.exe
          fi
          cp "updater-fragment-${{ matrix.platform_os }}.json" release-assets/
          test -n "$(find release-assets -type f -print -quit)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform_os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs:
      - prepare-public-release
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist-release
          merge-multiple: true

      - name: Build manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -f dist-release/RabbitInterview-macOS-universal.dmg
          test -f dist-release/RabbitInterview-Windows-x64.exe
          PARTS="$(find dist-release -maxdepth 1 -name 'updater-fragment-*.json' -print | sort | paste -sd, -)"
          test -n "$PARTS"
          node scripts/build-updater-manifest.mjs merge \
            --version "$VERSION" \
            --notes "$GITHUB_REF_NAME 测试版" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --parts "$PARTS" \
            --out dist-release/latest.json
          find dist-release -maxdepth 1 -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.msi' -o \
            -name '*.exe' \
          \) -print0 | sort -z | xargs -0 sha256sum | sed 's#  dist-release/#  #' > dist-release/SHA256SUMS.txt
          node scripts/verify-release-assets.mjs dist-release

      - name: Build marketing site
        run: |
          npm run verify:marketing
          npm run build:marketing

      - name: Upload and publish public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DISTRIBUTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PUBLIC_DISTRIBUTION_TOKEN is not set; skipping public repository publish."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" dist-release/* -R "$PUBLIC_REPO" --clobber
          gh release edit "$GITHUB_REF_NAME" \
            -R "$PUBLIC_REPO" \
            --draft=false \
            --title "Rabbit Interview $GITHUB_REF_NAME 测试版" \
            --notes $'公开测试版。\n\n当前 macOS 包没有 Developer ID 与公证，Windows 包没有 Authenticode 签名，安装时可能出现系统安全警告。请从本 Release 下载，并核对 SHA256SUMS.txt。\n\n使用实时语音需要 Deepgram API Key，回答建议需要任一受支持的模型 API Key。仅在面试或测评规则允许辅助工具时使用。'
          ASSETS="$(gh release view "$GITHUB_REF_NAME" -R "$PUBLIC_REPO" --json assets --jq '.assets[].name')"
          for required in RabbitInterview-macOS-universal.dmg RabbitInterview-Windows-x64.exe latest.json SHA256SUMS.txt; do
            grep -Fxq "$required" <<<"$ASSETS" || { echo "Missing public release asset: $required" >&2; exit 1; }
          done

      - name: Publish Pages files
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DISTRIBUTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PUBLIC_DISTRIBUTION_TOKEN is not set; skipping public Pages publish."
            exit 0
          fi
          gh auth setup-git
          gh repo clone "$PUBLIC_REPO" public-distribution -- --branch main --single-branch
          rsync -a --delete dist-marketing/ public-distribution/docs/
          touch public-distribution/docs/.nojekyll
          git -C public-distribution config user.name github-actions[bot]
          git -C public-distribution config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C public-distribution add docs
          if git -C public-distribution diff --cached --quiet; then
            echo "Pages output already current."
          else
            git -C public-distribution commit -m "Publish $GITHUB_REF_NAME marketing site"
            git -C public-distribution push origin main
          fi
