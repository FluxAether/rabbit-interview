name: Release

on: workflow_dispatch

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, macOS]
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: app,dmg
            platform_os: darwin
          - os: [self-hosted, Windows]
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle: msi,nsis
            platform_os: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AudioTee universal sidecar
        if: matrix.platform_os == 'darwin'
        run: scripts/build-audiotee.sh universal

      - name: Build macOS application
        if: matrix.platform_os == 'darwin'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.audiotee.conf.json

      - name: Verify bundled AudioTee
        if: matrix.platform_os == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/OnCue.app"
          test -x "$APP/Contents/MacOS/audiotee"
          test "$(lipo -archs "$APP/Contents/MacOS/audiotee")" = "x86_64 arm64"
          codesign --verify --verbose=2 "$APP"
          IDENTIFIER=$(codesign -d --verbose=2 "$APP" 2>&1 | sed -n "s/^Identifier=//p")
          test "$IDENTIFIER" = "com.rabbitinterview.desktop"

      - name: Build Windows application
        if: matrix.platform_os == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Build updater fragment
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-updater-manifest.mjs fragment \
            --os "${{ matrix.platform_os }}" \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --repo "${{ github.repository }}" \
            --notes "$GITHUB_REF_NAME 测试版" \
            --out "updater-fragment-${{ matrix.platform_os }}.json"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-assets
          copy_normalized() {
            local source="$1"
            local name="${source##*/}"
            cp "$source" "release-assets/${name// /.}"
          }
          if [ "${{ matrix.platform_os }}" = "darwin" ]; then
            while IFS= read -r asset; do
              copy_normalized "$asset"
            done < <(find "$BUNDLE" -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \))
            INSTALLER="$(find "$BUNDLE" -type f -name '*.dmg' -print -quit)"
            test -n "$INSTALLER"
            cp "$INSTALLER" release-assets/RabbitInterview-macOS-universal.dmg
            test -f src-tauri/target/audiotee-checksums.txt
            cp src-tauri/target/audiotee-checksums.txt release-assets/
          else
            while IFS= read -r asset; do
              copy_normalized "$asset"
            done < <(find "$BUNDLE" -type f \( -name '*.msi' -o -name '*.msi.sig' \))
            INSTALLER="$(find "$BUNDLE" -type f -path '*/nsis/*-setup.exe' -print -quit)"
            test -n "$INSTALLER"
            cp "$INSTALLER" release-assets/RabbitInterview-Windows-x64.exe
            if [ -f "${INSTALLER}.sig" ]; then
              cp "${INSTALLER}.sig" release-assets/RabbitInterview-Windows-x64.exe.sig
            fi
          fi
          cp "updater-fragment-${{ matrix.platform_os }}.json" release-assets/
          test -n "$(find release-assets -type f -print -quit)"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform_os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs:
      - build
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist-release
          merge-multiple: true

      - name: Build manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test -f dist-release/RabbitInterview-macOS-universal.dmg
          test -f dist-release/RabbitInterview-Windows-x64.exe
          PARTS="$(find dist-release -maxdepth 1 -name 'updater-fragment-*.json' -print | sort | paste -sd, -)"
          test -n "$PARTS"
          node scripts/build-updater-manifest.mjs merge \
            --version "$VERSION" \
            --notes "$GITHUB_REF_NAME 测试版" \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --parts "$PARTS" \
            --out dist-release/latest.json
          find dist-release -maxdepth 1 -type f \( \
            -name '*.dmg' -o \
            -name '*.app.tar.gz' -o \
            -name '*.msi' -o \
            -name '*.exe' \
          \) -print0 | sort -z | xargs -0 sha256sum | sed 's#  dist-release/#  #' > dist-release/SHA256SUMS.txt
          node scripts/verify-release-assets.mjs dist-release

      - name: Upload and publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TABLE=$(printf "%s\n%s\n%s\n%s\n%s" \
            "| 操作系统 / Platform | 推荐安装包 / Recommended Package | 说明 / Description |" \
            "| :--- | :--- | :--- |" \
            "| **macOS** (Universal) | [RabbitInterview-macOS-universal.dmg](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/RabbitInterview-macOS-universal.dmg) | 支持 Apple Silicon (M系列) 与 Intel 架构，拖入 Applications 即可 |" \
            "| **Windows** (64-bit) | [RabbitInterview-Windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/RabbitInterview-Windows-x64.exe) | 标准安装向导程序 |" \
            "| **Windows MSI** (64-bit) | \`*.msi\` | 企业静默分发 / GPO 部署专用 |")
          NOTES=$(printf "%s\n\n%s\n\n%s\n\n%s\n\n%s" \
            "### 🚀 快速下载 / Quick Downloads" \
            "$TABLE" \
            "测试版。" \
            "当前 macOS 包没有 Developer ID 与公证，Windows 包没有 Authenticode 签名，安装时可能出现系统安全警告。请从本 Release 下载，并核对 SHA256SUMS.txt。" \
            "使用实时语音需要 Deepgram API Key，回答建议需要任一受支持的模型 API Key。仅在面试或测评规则允许辅助工具时使用。")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Source release $GITHUB_REF_NAME already exists; assets will be replaced."
          else
            gh release create "$GITHUB_REF_NAME" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes "构建完成。安装包与校验文件见本 Release。"
          fi
          gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --draft=false \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES"
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for required in RabbitInterview-macOS-universal.dmg RabbitInterview-Windows-x64.exe latest.json SHA256SUMS.txt; do
            grep -Fxq "$required" <<<"$ASSETS" || { echo "Missing source release asset: $required" >&2; exit 1; }
          done
