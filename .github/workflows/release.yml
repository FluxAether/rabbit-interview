name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: app,dmg
            platform_os: darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundle: msi,nsis
            platform_os: windows
          # Optional Linux
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu
          #   bundle: deb,appimage
          #   platform_os: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      # macOS specific signing/notarization (fill secrets in repo settings)
      # - name: Import Apple Developer Certificate (macOS)
      #   if: matrix.os == 'macos-latest' && secrets.APPLE_CERTIFICATE != ''
      #   uses: apple-actions/import-codesign-certs@v3
      #   with:
      #     p12-base64: ${{ secrets.APPLE_CERTIFICATE }}
      #     p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build AudioTee universal sidecar (macOS)
        if: matrix.os == 'macos-latest'
        run: scripts/build-audiotee.sh universal

      - name: Build Tauri App (macOS + AudioTee)
        if: matrix.os == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --config src-tauri/tauri.audiotee.conf.json

      - name: Verify bundled AudioTee (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Rabbit Interview.app"
          test -x "$APP/Contents/MacOS/audiotee"
          test "$(lipo -archs "$APP/Contents/MacOS/audiotee")" = "x86_64 arm64"
          codesign -f -s - --deep "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Build Tauri App (Windows)
        if: matrix.os == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Build updater fragment
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-updater-manifest.mjs fragment \
            --os "${{ matrix.platform_os }}" \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --notes "$GITHUB_REF_NAME" \
            --out "updater-fragment-${{ matrix.platform_os }}.json"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/audiotee-checksums.txt
            updater-fragment-*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release fragments and merge latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="$GITHUB_REF_NAME"
          mkdir -p /tmp/updater-parts
          # Download only fragment assets for this tag
          mapfile -t FRAGS < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | startswith("updater-fragment-")) | .name')
          if [ "${#FRAGS[@]}" -eq 0 ]; then
            echo "No updater-fragment-*.json assets found on ${TAG}" >&2
            exit 1
          fi
          PARTS=()
          for name in "${FRAGS[@]}"; do
            out="/tmp/updater-parts/$name"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name" -D /tmp/updater-parts
            PARTS+=("$out")
          done
          PUB_DATE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.published_at')"
          IFS=','
          node scripts/build-updater-manifest.mjs merge \
            --version "$VERSION" \
            --notes "$TAG" \
            --pub-date "$PUB_DATE" \
            --parts "${PARTS[*]}" \
            --out /tmp/latest.json
          unset IFS
          cat /tmp/latest.json
          gh release upload "$TAG" /tmp/latest.json -R "$GITHUB_REPOSITORY" --clobber
