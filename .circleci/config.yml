# Matches .github/workflows/release.yml: v* tag -> macOS+Windows installers -> GitHub Release.
# CircleCI `release` context vars required:
#   GH_TOKEN or GITHUB_TOKEN  (GitHub PAT with repo contents:write)
#   TAURI_SIGNING_PRIVATE_KEY
version: 2.1

orbs:
  node: circleci/node@7
  gh: circleci/github-cli@2.6

commands:
  collect-release-assets:
    parameters:
      platform_os:
        type: string
      target:
        type: string
      run_shell:
        type: string
        default: bash
    steps:
      - run:
          name: Build updater fragment
          shell: << parameters.run_shell >>
          command: |
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            node scripts/build-updater-manifest.mjs fragment \
              --os "<< parameters.platform_os >>" \
              --target "<< parameters.target >>" \
              --version "$VERSION" \
              --tag "$CIRCLE_TAG" \
              --repo "$REPO" \
              --notes "$CIRCLE_TAG 测试版" \
              --out "updater-fragment-<< parameters.platform_os >>.json"
      - run:
          name: Collect release assets
          shell: << parameters.run_shell >>
          command: |
            set -euo pipefail
            BUNDLE="src-tauri/target/<< parameters.target >>/release/bundle"
            mkdir -p release-assets
            copy_normalized() {
              local source="$1"
              local name="${source##*/}"
              cp "$source" "release-assets/${name// /.}"
            }
            while IFS= read -r asset; do
              copy_normalized "$asset"
            done < <(find "$BUNDLE" -type f \( \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" -o \
              -name "*.app.tar.gz.sig" -o \
              -name "*.msi" -o \
              -name "*.msi.sig" -o \
              -name "*.exe" -o \
              -name "*.exe.sig" \
            \))
            if [ "<< parameters.platform_os >>" = "darwin" ]; then
              INSTALLER="$(find "$BUNDLE" -type f -name "*.dmg" -print -quit)"
              test -n "$INSTALLER"
              cp "$INSTALLER" release-assets/RabbitInterview-macOS-universal.dmg
              test -f src-tauri/target/audiotee-checksums.txt
              cp src-tauri/target/audiotee-checksums.txt release-assets/
            else
              INSTALLER="$(find "$BUNDLE" -type f -path "*/nsis/*-setup.exe" -print -quit)"
              test -n "$INSTALLER"
              cp "$INSTALLER" release-assets/RabbitInterview-Windows-x64.exe
            fi
            cp "updater-fragment-<< parameters.platform_os >>.json" release-assets/
            test -n "$(find release-assets -type f -print -quit)"
      - persist_to_workspace:
          root: release-assets
          paths:
            - .
      - store_artifacts:
          path: release-assets
          destination: release-assets-<< parameters.platform_os >>

jobs:
  build-macos:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Check updater signing key
          command: |
            set -euo pipefail
            test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || {
              echo "Set TAURI_SIGNING_PRIVATE_KEY in the CircleCI release context" >&2
              exit 1
            }
      - run:
          name: Install Rosetta
          command: |
            set -euo pipefail
            if [ "$(uname -m)" = "arm64" ]; then
              /usr/sbin/softwareupdate --install-rosetta --agree-to-license
            fi
      - run:
          name: Setup Rust
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            if [ -f "$HOME/.cargo/env" ]; then
              . "$HOME/.cargo/env"
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup toolchain install stable
            rustup default stable
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - node/install:
          node-version: "20.19"
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build AudioTee universal sidecar
          command: scripts/build-audiotee.sh universal
      - run:
          name: Build macOS application
          no_output_timeout: 60m
          command: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.audiotee.conf.json
      - run:
          name: Verify bundled AudioTee
          command: |
            set -euo pipefail
            APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Rabbit Interview.app"
            test -x "$APP/Contents/MacOS/audiotee"
            test "$(lipo -archs "$APP/Contents/MacOS/audiotee")" = "x86_64 arm64"
            codesign --verify --verbose=2 "$APP"
            IDENTIFIER=$(codesign -d --verbose=2 "$APP" 2>&1 | sed -n "s/^Identifier=//p")
            test "$IDENTIFIER" = "com.rabbitinterview.desktop"
      - collect-release-assets:
          platform_os: darwin
          target: universal-apple-darwin

  build-windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Check updater signing key
          command: |
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              Write-Error "Set TAURI_SIGNING_PRIVATE_KEY in the CircleCI release context"
              exit 1
            }
      - run:
          name: Setup Rust
          command: |
            $ErrorActionPreference = "Stop"
            $cargoBin = Join-Path $HOME ".cargo\bin"
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              $installer = Join-Path $env:TEMP "rustup-init.exe"
              Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $installer
              & $installer -y --profile minimal --default-toolchain stable --default-host x86_64-pc-windows-msvc
            }
            $env:Path = "$cargoBin;$env:Path"
            rustup toolchain install stable
            rustup default stable
            rustup target add x86_64-pc-windows-msvc
      - run:
          name: Setup Node 20
          command: |
            $ErrorActionPreference = "Stop"
            $major = ""
            try { $major = node -p "process.versions.node.split('.')[0]" } catch {}
            if ($major -ne "20") {
              choco install nodejs-lts --version=20.19.0 -y
            }
            $nodeBin = "C:\Program Files\nodejs"
            $env:Path = "$nodeBin;$env:Path"
            node -v
            npm -v
      - run:
          name: Install WiX
          command: |
            $ErrorActionPreference = "Stop"
            if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
              choco install wixtoolset -y
            }
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build Windows application
          no_output_timeout: 60m
          command: |
            $env:Path = "$(Join-Path $HOME '.cargo\bin');$env:Path"
            npm run tauri build -- --target x86_64-pc-windows-msvc --bundles msi,nsis
      - collect-release-assets:
          platform_os: windows
          target: x86_64-pc-windows-msvc
          run_shell: bash.exe

  publish:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - attach_workspace:
          at: dist-release
      - run:
          name: Configure GitHub token
          command: |
            set -euo pipefail
            TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
            if [ -z "$TOKEN" ]; then
              echo "Set GH_TOKEN or GITHUB_TOKEN with repo contents:write" >&2
              exit 1
            fi
            echo "export GH_TOKEN=$TOKEN" >> "$BASH_ENV"
            echo "export GITHUB_TOKEN=$TOKEN" >> "$BASH_ENV"
            echo "export GH_REPO=${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" >> "$BASH_ENV"
            echo "export GITHUB_REPOSITORY=${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" >> "$BASH_ENV"
      - gh/setup
      - run:
          name: Build manifest and checksums
          command: |
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            test -f dist-release/RabbitInterview-macOS-universal.dmg
            test -f dist-release/RabbitInterview-Windows-x64.exe
            PARTS="$(find dist-release -maxdepth 1 -name "updater-fragment-*.json" -print | sort | paste -sd, -)"
            test -n "$PARTS"
            node scripts/build-updater-manifest.mjs merge \
              --version "$VERSION" \
              --notes "$CIRCLE_TAG 测试版" \
              --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --parts "$PARTS" \
              --out dist-release/latest.json
            find dist-release -maxdepth 1 -type f \( \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" -o \
              -name "*.msi" -o \
              -name "*.exe" \
            \) -print0 | sort -z | xargs -0 sha256sum | sed "s#  dist-release/#  #" > dist-release/SHA256SUMS.txt
            node scripts/verify-release-assets.mjs dist-release
      - run:
          name: Upload and publish source release
          command: |
            set -euo pipefail
            NOTES=$(printf "%s\n\n%s\n\n%s" \
              "测试版。" \
              "当前 macOS 包没有 Developer ID 与公证，Windows 包没有 Authenticode 签名，安装时可能出现系统安全警告。请从本 Release 下载，并核对 SHA256SUMS.txt。" \
              "使用实时语音需要 Deepgram API Key，回答建议需要任一受支持的模型 API Key。仅在面试或测评规则允许辅助工具时使用。")
            if gh release view "$CIRCLE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Source release $CIRCLE_TAG already exists; assets will be replaced."
            else
              gh release create "$CIRCLE_TAG" \
                --repo "$GH_REPO" \
                --target "$CIRCLE_SHA1" \
                --draft \
                --title "$CIRCLE_TAG" \
                --notes "构建完成。安装包与校验文件见本 Release。"
            fi
            gh release upload "$CIRCLE_TAG" dist-release/* --repo "$GH_REPO" --clobber
            gh release edit "$CIRCLE_TAG" \
              --repo "$GH_REPO" \
              --draft=false \
              --title "$CIRCLE_TAG" \
              --notes "$NOTES"
            ASSETS="$(gh release view "$CIRCLE_TAG" --repo "$GH_REPO" --json assets --jq ".assets[].name")"
            for required in RabbitInterview-macOS-universal.dmg RabbitInterview-Windows-x64.exe latest.json SHA256SUMS.txt; do
              printf "%s\n" "$ASSETS" | grep -Fxq "$required" || { echo "Missing source release asset: $required" >&2; exit 1; }
            done
      - store_artifacts:
          path: dist-release
          destination: dist-release

workflows:
  release:
    jobs:
      - build-macos:
          context: release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-windows:
          context: release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish:
          context: release
          requires:
            - build-macos
            - build-windows
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
