# Matches .github/workflows/release.yml: v* tag -> macOS+Windows installers -> GitHub Release.
# Also deploys server, then builds and publishes landing to Cloudflare Workers.
# CircleCI contexts required:
#   `release`: TAURI_SIGNING_PRIVATE_KEY, GH_TOKEN or GITHUB_TOKEN (GitHub PAT with repo contents:write)
#   `server-deploy`: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (optional: DEPLOY_PORT, DEPLOY_PATH)
#     DEPLOY_USER needs passwordless sudo for mkdir, tee, chmod, mv, and systemctl.
#   `cloudflare-deploy`: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, VITE_HOSTED_GATEWAY_URL
version: 2.1

orbs:
  node: circleci/node@7
  gh: circleci/github-cli@2.6

commands:
  collect-release-assets:
    parameters:
      platform_os:
        type: string
      target:
        type: string
      run_shell:
        type: string
        default: bash
    steps:
      - run:
          name: Build updater fragment
          shell: << parameters.run_shell >>
          command: |
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            node scripts/build-updater-manifest.mjs fragment \
              --os "<< parameters.platform_os >>" \
              --target "<< parameters.target >>" \
              --version "$VERSION" \
              --tag "$CIRCLE_TAG" \
              --repo "$REPO" \
              --notes "$CIRCLE_TAG 测试版" \
              --out "updater-fragment-<< parameters.platform_os >>.json"
      - run:
          name: Collect release assets
          shell: << parameters.run_shell >>
          command: |
            set -euo pipefail
            if [ "<< parameters.platform_os >>" = "windows" ]; then
              find() { /usr/bin/find.exe "$@"; }
            fi
            BUNDLE="src-tauri/target/<< parameters.target >>/release/bundle"
            mkdir -p release-assets
            copy_normalized() {
              local source="$1"
              local name="${source##*/}"
              cp "$source" "release-assets/${name// /.}"
            }
            if [ "<< parameters.platform_os >>" = "darwin" ]; then
              while IFS= read -r asset; do
                copy_normalized "$asset"
              done < <(find "$BUNDLE" -type f \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \))
              INSTALLER="$(find "$BUNDLE" -type f -name "*.dmg" -print -quit)"
              test -n "$INSTALLER"
              cp "$INSTALLER" release-assets/OnCue-macOS-universal.dmg
              test -f src-tauri/target/audiotee-checksums.txt
              cp src-tauri/target/audiotee-checksums.txt release-assets/
            else
              while IFS= read -r asset; do
                copy_normalized "$asset"
              done < <(find "$BUNDLE" -type f \( -name "*.msi" -o -name "*.msi.sig" \))
              INSTALLER="$(find "$BUNDLE" -type f -path "*/nsis/*-setup.exe" -print -quit)"
              test -n "$INSTALLER"
              cp "$INSTALLER" release-assets/OnCue-Windows-x64.exe
              if [ -f "${INSTALLER}.sig" ]; then
                cp "${INSTALLER}.sig" release-assets/OnCue-Windows-x64.exe.sig
              fi
            fi
            cp "updater-fragment-<< parameters.platform_os >>.json" release-assets/
            test -n "$(find release-assets -type f -print -quit)"
      - persist_to_workspace:
          root: release-assets
          paths:
            - .
      - store_artifacts:
          path: release-assets
          destination: release-assets-<< parameters.platform_os >>

jobs:
  build-macos:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Check updater signing key
          command: |
            set -euo pipefail
            test -n "${TAURI_SIGNING_PRIVATE_KEY:-}" || {
              echo "Set TAURI_SIGNING_PRIVATE_KEY in the CircleCI tauri-signing context" >&2
              exit 1
            }
      - run:
          name: Install Rosetta
          command: |
            set -euo pipefail
            if [ "$(uname -m)" = "arm64" ]; then
              /usr/sbin/softwareupdate --install-rosetta --agree-to-license
            fi
      - run:
          name: Setup Rust
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            if [ -f "$HOME/.cargo/env" ]; then
              . "$HOME/.cargo/env"
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup toolchain install stable
            rustup default stable
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - node/install:
          node-version: "20.19"
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build AudioTee universal sidecar
          command: scripts/build-audiotee.sh universal
      - run:
          name: Build macOS application
          no_output_timeout: 60m
          command: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.audiotee.conf.json --config src-tauri/tauri.updater.conf.json
      - run:
          name: Verify bundled AudioTee
          command: |
            set -euo pipefail
            APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/OnCue.app"
            test -x "$APP/Contents/MacOS/audiotee"
            test "$(lipo -archs "$APP/Contents/MacOS/audiotee")" = "x86_64 arm64"
            codesign --verify --verbose=2 "$APP"
            IDENTIFIER=$(codesign -d --verbose=2 "$APP" 2>&1 | sed -n "s/^Identifier=//p")
            test "$IDENTIFIER" = "com.oncue.desktop"
      - collect-release-assets:
          platform_os: darwin
          target: universal-apple-darwin

  build-windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout
      - run:
          name: Check updater signing key
          command: |
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              Write-Error "Set TAURI_SIGNING_PRIVATE_KEY in the CircleCI tauri-signing context"
              exit 1
            }
      - run:
          name: Setup Rust
          command: |
            $ErrorActionPreference = "Stop"
            $cargoBin = Join-Path $HOME ".cargo\bin"
            if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
              $installer = Join-Path $env:TEMP "rustup-init.exe"
              Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile $installer
              & $installer -y --profile minimal --default-toolchain stable --default-host x86_64-pc-windows-msvc
            }
            $env:Path = "$cargoBin;$env:Path"
            rustup toolchain install stable
            rustup default stable
            rustup target add x86_64-pc-windows-msvc
      - run:
          name: Setup Node 20
          command: |
            $ErrorActionPreference = "Stop"
            nvm install 20.19.0
            nvm use 20.19.0
            $nodeBin = "C:\Program Files\nodejs"
            $env:Path = "$nodeBin;$env:Path"
            if ((node -p "process.versions.node.split('.')[0]") -ne "20") {
              throw "Expected Node 20"
            }
            node -v
            npm -v
      - run:
          name: Install WiX
          command: |
            $ErrorActionPreference = "Stop"
            if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
              choco install wixtoolset -y
            }
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build Windows application
          no_output_timeout: 60m
          command: |
            $env:Path = "$(Join-Path $HOME '.cargo\bin');$env:Path"
            npm run tauri build -- --target x86_64-pc-windows-msvc --bundles msi,nsis --config src-tauri/tauri.updater.conf.json
      - collect-release-assets:
          platform_os: windows
          target: x86_64-pc-windows-msvc
          run_shell: bash.exe

  build-server:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Setup Rust
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            if [ -f "$HOME/.cargo/env" ]; then
              . "$HOME/.cargo/env"
            fi
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup default stable
      - run:
          name: Build oncue-gateway binary
          command: |
            set -euo pipefail
            cargo build --manifest-path server/Cargo.toml --locked --release
      - run:
          name: Package server release assets
          command: |
            set -euo pipefail
            mkdir -p dist-server
            cp server/target/release/oncue-gateway dist-server/
            chmod +x dist-server/oncue-gateway
            (cd dist-server && sha256sum oncue-gateway > SHA256SUMS.txt)
      - persist_to_workspace:
          root: dist-server
          paths:
            - oncue-gateway
            - SHA256SUMS.txt
      - store_artifacts:
          path: dist-server
          destination: dist-server

  deploy-server:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: dist-server
      - run:
          name: Verify server binary
          command: |
            set -euo pipefail
            test -f dist-server/oncue-gateway
            test -x dist-server/oncue-gateway
      - run:
          name: Deploy to production server via SSH
          command: |
            set -euo pipefail
            test -n "${DEPLOY_HOST:-}" || { echo "DEPLOY_HOST is required in the server-deploy context" >&2; exit 1; }
            test -n "${DEPLOY_USER:-}" || { echo "DEPLOY_USER is required in the server-deploy context" >&2; exit 1; }
            test -n "${DEPLOY_SSH_KEY:-}" || { echo "DEPLOY_SSH_KEY is required in the server-deploy context" >&2; exit 1; }

            DEPLOY_PORT="${DEPLOY_PORT:-22}"
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/oncue-gateway}"

            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "$DEPLOY_SSH_KEY" | base64 -d 2>/dev/null > ~/.ssh/deploy_key || echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

            SSH_CMD="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST"
            printf -v REMOTE_DEPLOY_PATH '%q' "$DEPLOY_PATH"
            case "$DEPLOY_PATH" in /*) ;; *) echo "DEPLOY_PATH must be absolute" >&2; exit 1 ;; esac
            case "$DEPLOY_PATH$DEPLOY_USER" in *$'\n'*|*$'\r'*) echo "Deployment paths and users must be single-line values" >&2; exit 1 ;; esac

            $SSH_CMD "sudo -n systemctl daemon-reload"
            SERVICE_NAME=oncue-gateway
            SERVICE_STATE="$($SSH_CMD "sudo -n systemctl show --property=LoadState --value $SERVICE_NAME")"
            if [ "$SERVICE_STATE" = not-found ]; then
              SERVICE_NAME=rabbit-gateway
              SERVICE_STATE="$($SSH_CMD "sudo -n systemctl show --property=LoadState --value $SERVICE_NAME")"
            fi
            case "$SERVICE_STATE" in
              loaded) ;;
              not-found)
                SERVICE_NAME=oncue-gateway
                $SSH_CMD "test -r $REMOTE_DEPLOY_PATH/.env" || {
                  echo "No gateway service exists. Prepare $DEPLOY_PATH/.env readable by $DEPLOY_USER before first deployment; see docs/hosted_gateway_runbook.md." >&2
                  exit 1
                }
                ;;
              *) echo "Cannot deploy $SERVICE_NAME: systemd LoadState=$SERVICE_STATE" >&2; exit 1 ;;
            esac

            # systemd path specifiers and ExecStart quoting differ from shell quoting.
            UNIT_WORKDIR="${DEPLOY_PATH//%/%%}/"
            UNIT_EXEC_PATH="${UNIT_WORKDIR//\\/\\\\}oncue-gateway"
            UNIT_EXEC_PATH="${UNIT_EXEC_PATH//\"/\\\"}"
            # Pass the path as an argument; systemd restricts characters in executable names.
            UNIT_EXEC_START="ExecStart=:/bin/sh -c 'exec \"\$1\"' -- \"$UNIT_EXEC_PATH\""

            echo "Uploading oncue-gateway binary to $DEPLOY_HOST:$DEPLOY_PATH..."
            $SSH_CMD "sudo -n mkdir -p -- $REMOTE_DEPLOY_PATH"
            $SSH_CMD "sudo -n tee -- $REMOTE_DEPLOY_PATH/oncue-gateway.new >/dev/null" < dist-server/oncue-gateway
            $SSH_CMD "sudo -n chmod -- 755 $REMOTE_DEPLOY_PATH/oncue-gateway.new && sudo -n mv -f -- $REMOTE_DEPLOY_PATH/oncue-gateway.new $REMOTE_DEPLOY_PATH/oncue-gateway"

            install_unit_file() {
              $SSH_CMD "sudo -n tee $1.new >/dev/null"
              $SSH_CMD "sudo -n chmod 644 $1.new && sudo -n mv -f $1.new $1"
            }
            if [ "$SERVICE_STATE" = not-found ]; then
              echo "Installing oncue-gateway systemd service..."
              printf '%s\n' '[Unit]' 'Description=OnCue Gateway' 'After=network-online.target' 'Wants=network-online.target' \
                '[Service]' 'Type=simple' "User=$DEPLOY_USER" "WorkingDirectory=$UNIT_WORKDIR" \
                "$UNIT_EXEC_START" 'Restart=on-failure' 'RestartSec=5' '[Install]' 'WantedBy=multi-user.target' \
                | install_unit_file /etc/systemd/system/oncue-gateway.service
            fi
            # Preserve existing User, WorkingDirectory, EnvironmentFile and other service settings.
            $SSH_CMD "sudo -n mkdir -p /etc/systemd/system/$SERVICE_NAME.service.d"
            printf '%s\n' '[Service]' 'ExecStart=' "$UNIT_EXEC_START" \
              | install_unit_file /etc/systemd/system/$SERVICE_NAME.service.d/zz-oncue-deploy.conf
            $SSH_CMD "sudo -n systemctl daemon-reload && sudo -n systemctl enable $SERVICE_NAME"

            echo "Restarting $SERVICE_NAME systemd service..."
            $SSH_CMD "sudo -n systemctl restart $SERVICE_NAME"

            echo "Checking gateway health..."
            HEALTH_URL="${GATEWAY_HEALTH_CHECK_URL:-http://127.0.0.1:8787/healthz}"
            $SSH_CMD "for i in {1..10}; do if curl -fsS \"$HEALTH_URL\" >/dev/null 2>&1; then echo 'Gateway healthy!'; exit 0; fi; sleep 1; done; echo 'Gateway health check timed out' >&2; exit 1"

  build-deploy-landing:
    docker:
      - image: cimg/node:22.22
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Check Cloudflare deployment configuration
          command: |
            set -euo pipefail
            test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is required in the cloudflare-deploy context" >&2; exit 1; }
            test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is required in the cloudflare-deploy context" >&2; exit 1; }
            test -n "${VITE_HOSTED_GATEWAY_URL:-}" || { echo "VITE_HOSTED_GATEWAY_URL is required in the cloudflare-deploy context" >&2; exit 1; }
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build landing
          command: npm run landing:build
      - store_artifacts:
          path: landing/dist
          destination: landing
      - run:
          name: Deploy landing to Cloudflare Workers
          command: npx --yes wrangler@4.131.2 deploy --config landing/wrangler.jsonc

  publish:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - attach_workspace:
          at: dist-release
      - run:
          name: Configure GitHub token
          command: |
            set -euo pipefail
            TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
            if [ -z "$TOKEN" ]; then
              echo "Set GH_TOKEN or GITHUB_TOKEN with repo contents:write" >&2
              exit 1
            fi
            echo "export GH_TOKEN=$TOKEN" >> "$BASH_ENV"
            echo "export GITHUB_TOKEN=$TOKEN" >> "$BASH_ENV"
            echo "export GH_REPO=${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" >> "$BASH_ENV"
            echo "export GITHUB_REPOSITORY=${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" >> "$BASH_ENV"
      - gh/setup
      - run:
          name: Build manifest and checksums
          command: |
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            test -f dist-release/OnCue-macOS-universal.dmg
            test -f dist-release/OnCue-Windows-x64.exe
            PARTS="$(find dist-release -maxdepth 1 -name "updater-fragment-*.json" -print | sort | paste -sd, -)"
            test -n "$PARTS"
            node scripts/build-updater-manifest.mjs merge \
              --version "$VERSION" \
              --notes "$CIRCLE_TAG 测试版" \
              --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --parts "$PARTS" \
              --out dist-release/latest.json
            find dist-release -maxdepth 1 -type f \( \
              -name "*.dmg" -o \
              -name "*.app.tar.gz" -o \
              -name "*.msi" -o \
              -name "*.exe" \
            \) -print0 | sort -z | xargs -0 sha256sum | sed "s#  dist-release/#  #" > dist-release/SHA256SUMS.txt
            node scripts/verify-release-assets.mjs dist-release
      - run:
          name: Upload and publish source release
          command: |
            set -euo pipefail
            TABLE=$(printf "%s\n%s\n%s\n%s\n%s" \
              "| 操作系统 / Platform | 推荐安装包 / Recommended Package | 说明 / Description |" \
              "| :--- | :--- | :--- |" \
              "| **macOS** (Universal) | [OnCue-macOS-universal.dmg](https://github.com/${GH_REPO}/releases/download/${CIRCLE_TAG}/OnCue-macOS-universal.dmg) | 支持 Apple Silicon (M系列) 与 Intel 架构，拖入 Applications 即可 |" \
              "| **Windows** (64-bit) | [OnCue-Windows-x64.exe](https://github.com/${GH_REPO}/releases/download/${CIRCLE_TAG}/OnCue-Windows-x64.exe) | 标准安装向导程序 |" \
              "| **Windows MSI** (64-bit) | \`*.msi\` | 企业静默分发 / GPO 部署专用 |")
            NOTES=$(printf "%s\n\n%s\n\n%s\n\n%s\n\n%s" \
              "### 🚀 快速下载 / Quick Downloads" \
              "$TABLE" \
              "测试版。" \
              "当前 macOS 包没有 Developer ID 与公证，Windows 包没有 Authenticode 签名，安装时可能出现系统安全警告。请从本 Release 下载，并核对 SHA256SUMS.txt。" \
              "使用实时语音需要 Deepgram API Key，回答建议需要任一受支持的模型 API Key。仅在面试或测评规则允许辅助工具时使用。")
            if gh release view "$CIRCLE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
              echo "Source release $CIRCLE_TAG already exists; assets will be replaced."
            else
              gh release create "$CIRCLE_TAG" \
                --repo "$GH_REPO" \
                --target "$CIRCLE_SHA1" \
                --draft \
                --title "$CIRCLE_TAG" \
                --notes "构建完成。安装包与校验文件见本 Release。"
            fi
            gh release upload "$CIRCLE_TAG" dist-release/* --repo "$GH_REPO" --clobber
            gh release edit "$CIRCLE_TAG" \
              --repo "$GH_REPO" \
              --draft=false \
              --title "$CIRCLE_TAG" \
              --notes "$NOTES"
            ASSETS="$(gh release view "$CIRCLE_TAG" --repo "$GH_REPO" --json assets --jq ".assets[].name")"
            for required in OnCue-macOS-universal.dmg OnCue-Windows-x64.exe latest.json SHA256SUMS.txt; do
              printf "%s\n" "$ASSETS" | grep -Fxq "$required" || { echo "Missing source release asset: $required" >&2; exit 1; }
            done
      - store_artifacts:
          path: dist-release
          destination: dist-release

workflows:
  release:
    jobs:
      - build-macos:
          context: release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-server:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - deploy-server:
          context: server-deploy
          requires:
            - build-server
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-deploy-landing:
          context: cloudflare-deploy
          requires:
            - deploy-server
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build-windows:
          context: release
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - publish:
          context: release
          serial-group: << pipeline.project.slug >>/release
          requires:
            - build-macos
            - build-windows
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
