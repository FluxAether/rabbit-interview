<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="候场">
  <title>候场</title>
  <desc>A hard slab split by a right-offset cue slit. House left, wing right. Not a rabbit.</desc>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="#171717"/>
  <defs>
    <clipPath id="slab">
      <rect x="196" y="196" width="632" height="632" rx="28"/>
    </clipPath>
  </defs>
  <g clip-path="url(#slab)">
    <rect x="196" y="196" width="632" height="632" fill="#F7F7F8"/>
    <g transform="rotate(-13 708 512)">
      <rect x="672" y="20" width="76" height="1000" fill="#171717"/>
    </g>
  </g>
</svg>
