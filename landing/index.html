<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('oncue-theme');
          if (!stored) {
            var appStored = localStorage.getItem('theme');
            if (appStored === 'Dark') stored = 'dark';
            else if (appStored === 'Light') stored = 'light';
          }
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) {
            meta.setAttribute('content', isDark ? 'dark' : 'light');
          }
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="OnCue 是本机优先的桌面面试助手。系统音频听面试官，置顶浮窗只给你看。"
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>OnCue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
